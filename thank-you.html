<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>
body{
background:#050505;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

/* Container */
.thank-container{
max-width:400px;
}

/* Icon animation */
.checkmark{
font-size:60px;
color:#00eaff;
margin-bottom:20px;
animation:pop 0.6s ease;
}

@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}

/* Text */
.thank-container h1{
margin-bottom:10px;
}

.thank-container p{
color:#aaa;
margin-bottom:25px;
}

/* Button */
.back-btn{
padding:12px 25px;
background:linear-gradient(90deg,#00eaff,#00aaff);
border-radius:25px;
color:#000;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.back-btn:hover{
transform:scale(1.05);
}
</style>

</head>

<body>

<div class="thank-container">

<div class="checkmark">✔</div>

<h1>Thank You!</h1>

<p>Your request has been submitted successfully.  
We will contact you soon.</p>

<a href="index.html" class="back-btn">Back to Home</a>

</div>

</body>
</html>
